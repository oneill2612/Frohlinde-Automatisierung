<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<title>FC Frohlinde Spielplan</title>

<style>

@font-face {
    font-family: "Frohlinde";
    src: url("assets/Karnchang.ttf");
}

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 1080px;
    min-height: 1920px;

    font-family:
        "Frohlinde",
        Arial,
        sans-serif;

    background:
        #07559b;

}

body {

    background-image:
        linear-gradient(
            rgba(0, 50, 100, 0.55),
            rgba(0, 50, 100, 0.55)
        ),
        url("assets/background.png");

    background-size: cover;
    background-position: center;

    color: white;

}

.container {

    width: 100%;
    min-height: 1920px;

    padding:
        65px 55px 70px 55px;

}

.header {

    text-align: center;

    margin-bottom: 55px;

}

.logo {

    width: 190px;
    height: 190px;

    object-fit: contain;

    margin-bottom: 15px;

}

.title {

    font-size: 72px;

    font-weight: 900;

    letter-spacing: 2px;

    text-transform: uppercase;

    text-shadow:
        4px 4px 0 rgba(0,0,0,.35);

}

.subtitle {

    font-family: Arial, sans-serif;

    font-size: 30px;

    margin-top: 8px;

    opacity: .9;

}

.spiel {

    background:
        rgba(255,255,255,.96);

    color: #101010;

    border-radius: 26px;

    margin-bottom: 28px;

    padding: 28px 30px 30px;

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.25);

}

.spiel-header {

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-bottom: 22px;

}

.datum {

    font-size: 30px;

    font-weight: bold;

}

.wettbewerb {

    font-family: Arial, sans-serif;

    font-size: 22px;

    color: #555;

    text-align: right;

}

.teams {

    display: grid;

    grid-template-columns:
        1fr 110px 1fr;

    align-items: center;

    gap: 10px;

}

.team {

    font-family: Arial, sans-serif;

    font-size: 32px;

    font-weight: 800;

    line-height: 1.15;

}

.heim {

    text-align: right;

}

.gast {

    text-align: left;

}

.zeit {

    text-align: center;

    font-family: Arial, sans-serif;

    font-size: 35px;

    font-weight: 900;

    color: #07559b;

}

.footer {

    margin-top: 50px;

    text-align: center;

    font-family: Arial, sans-serif;

    font-size: 24px;

    opacity: .9;

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <img
            class="logo"
            src="assets/logo.png"
        >

        <div class="title">
            Spielplan
        </div>

        <div class="subtitle">
            FC Frohlinde Jugend
        </div>

    </div>


    {% if spiele %}

        {% for spiel in spiele %}

        <div class="spiel">

            <div class="spiel-header">

                <div class="datum">
                    {{ spiel.datum_formatiert }}
                </div>

                <div class="wettbewerb">
                    {{ spiel.wettbewerb }}
                </div>

            </div>


            <div class="teams">

                <div class="team heim">
                    {{ spiel.heim }}
                </div>

                <div class="zeit">
                    {{ spiel.zeit }}
                </div>

                <div class="team gast">
                    {{ spiel.gast }}
                </div>

            </div>

        </div>

        {% endfor %}

    {% else %}

        <div class="spiel">

            <div class="team">
                Dieses Wochenende stehen
                keine Spiele an.
            </div>

        </div>

    {% endif %}


    <div class="footer">

        FC Frohlinde e.V. · Jugend

    </div>

</div>

</body>

</html>
